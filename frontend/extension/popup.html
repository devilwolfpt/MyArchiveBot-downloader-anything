<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { width: 380px; padding: 0; background: var(--bg); }
    .shell { padding: 16px; gap: 12px; }
    .card { padding: 14px; }
    .topbar { flex-direction: column; align-items: stretch; gap: 10px; }
    .brand h1 { font-size: 16px; }
    .subtitle { font-size: 11.5px; }
    .topbar-actions { justify-content: space-between; }
    .log { max-height: 110px; }
    .format-list { max-height: 190px; }
    .btn { width: 100%; }
    .btn-ghost { width: auto; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .mode span { padding: 6px 12px; font-size: 12px; }
    .field { margin-bottom: 8px; }
    .field span { font-size: 11px; }
    input, select { padding: 8px 10px !important; font-size: 13px !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>MyArchive Downloader</h1>
          <p class="subtitle">Painel lateral do browser</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="api-status" class="pill pill-idle">A ligar…</span>
        <button id="btn-settings" class="btn btn-ghost btn-sm" type="button">API</button>
      </div>
    </header>

    <section id="settings-panel" class="card settings hidden">
      <label class="field">
        <span>Base da API</span>
        <input id="inp-api-base" type="url" placeholder="http://localhost:8000/api" />
      </label>
      <label class="field">
        <span>API key</span>
        <input id="inp-api-key" type="password" placeholder="opcional" />
      </label>
      <div class="row">
        <button id="btn-save-settings" class="btn btn-primary btn-sm" type="button">Guardar</button>
        <button id="btn-close-settings" class="btn btn-ghost btn-sm" type="button">Fechar</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Fonte</h2>
      </div>
      <input id="inp-url" type="url" placeholder="URL do vídeo" spellcheck="false" />
      <div class="row" style="margin-top:10px">
        <button id="btn-extract" class="btn btn-primary" type="button">Analisar</button>
        <button id="btn-detect" class="btn btn-ghost" type="button">Usar página</button>
      </div>
    </section>

    <section id="formats-card" class="card hidden">
      <div class="card-head">
        <h2>Formato</h2>
        <span id="media-meta" class="media-meta"></span>
      </div>
      <div class="mode-row" role="radiogroup">
        <label class="mode"><input type="radio" name="mode" value="video" checked /><span>Vídeo</span></label>
        <label class="mode"><input type="radio" name="mode" value="both" /><span>V+A</span></label>
        <label class="mode"><input type="radio" name="mode" value="audio" /><span>Áudio</span></label>
      </div>
      <div id="format-list" class="format-list" role="radiogroup"></div>
      <button id="btn-download" class="btn btn-primary" type="button" style="margin-top:12px" disabled>
        Descarregar
      </button>
    </section>

    <section id="progress-card" class="card hidden">
      <div class="card-head">
        <h2>Progresso</h2>
        <button id="btn-cancel" class="btn btn-danger btn-sm hidden" type="button">Cancelar</button>
      </div>
      <div class="progress-head">
        <span id="progress-phase" class="progress-phase">A preparar…</span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar" style="width:0%"></div>
        <div id="progress-bar-indeterminate" class="progress-bar progress-bar-indeterminate hidden"></div>
      </div>
      <div class="progress-stats">
        <span id="progress-size">—</span>
        <span id="progress-speed">—</span>
        <span id="progress-eta">—</span>
      </div>
      <p id="progress-message" class="hint"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Registo</h2>
        <button id="btn-clear-log" class="btn btn-ghost btn-sm" type="button">Limpar</button>
      </div>
      <pre id="log" class="log"></pre>
    </section>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
