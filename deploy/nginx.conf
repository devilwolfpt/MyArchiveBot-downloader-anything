# ---------------------------------------------------------------------------
# Nginx — reverse proxy para o MyArchive Downloader
# Inclui suporte a WebSocket (/api/ws/...) e buffering off para streaming.
# ---------------------------------------------------------------------------

upstream mad_api {
    server api:8000;
    keepalive 32;
}

# Limites (descomente para activar limites de taxa por IP no nginx)
# limit_req_zone $binary_remote_addr zone=mad_limit:10m rate=30r/m;

server {
    listen 80;
    server_name downloads.exemplo.com;

    # Redireciona para HTTPS (comente enquanto testar em HTTP)
    # return 301 https://$host$request_uri;

    # Limite de tamanho do corpo (requests de extracção são pequenos)
    client_max_body_size 2m;

    # --- Proxy ---------------------------------------------------------
    location /api/ {
        proxy_pass http://mad_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- WebSocket (progresso de download) --------------------------
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts longos: downloads grandes podem demorar
        proxy_connect_timeout 10s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # buffering off -> streaming imediato dos ficheiros
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Frontend estático (painel web)
    location /app/ {
        proxy_pass http://mad_api;
        proxy_set_header Host $host;
    }

    # Docs interativos
    location /docs {
        proxy_pass http://mad_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://mad_api;
        proxy_set_header Host $host;
    }

    # Rate limit opcional
    # location /api/ {
    #     limit_req zone=mad_limit burst=10 nodelay;
    #     ...
    # }
}

