[project]
name = "myarchive-downloader"
version = "1.0.0"
description = "Motor de download de media universal — suporte a 1750+ plataformas sem dependência pip externa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "cryptography>=42.0",
    "browser-cookie3>=0.20.1",
    "brotli>=1.1",
    "zstandard>=0.22",
    # Motor de extracção incorporado (não instala yt-dlp como pip package)
    "requests>=2.31",
    "urllib3>=2.0",
    "mutagen>=1.47",
    "pycryptodomex>=3.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
