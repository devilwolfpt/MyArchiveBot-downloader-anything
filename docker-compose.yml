# ---------------------------------------------------------------------------
# Stack de produção: API + reverse proxy Nginx
# ---------------------------------------------------------------------------
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: myarchive-downloader:1.0.0
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MAD_DATA_DIR: /app/data
      MAD_DOWNLOADS_DIR: /app/data/downloads
      MAD_CACHE_DIR: /app/data/cache
      MAD_TEMP_DIR: /app/data/tmp
      MAD_ROOT_PATH: ${ROOT_PATH:-}
    volumes:
      # Os ficheiros finais sobrevivem a reinícios
      - downloads:/app/data/downloads
      - cache:/app/data/cache
    expose:
      - "8000"
    networks:
      - mad
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - mad

  # Opcional: Redis para rate limiting distribuído e filas de jobs
  # (descomente e ajuste o backend para usar REDIS_URL)
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   networks: [mad]

volumes:
  downloads:
  cache:

networks:
  mad:
    driver: bridge
